# rumdl config for x-cmd/gpg.
#
# Project conventions / quirks that need suppression:
#
# MD036 — bold (**xxx**) is used as in-section sub-labels after H2
#   headings (e.g. "## How to verify a key" then "**Fingerprint math:**
#   ..."). This idiom is intentional and not a heading.
#
# MD041 — top-level docs (README.md, README.cn.md, docs/*.md) skip
#   the H1; the title is conveyed either in the H2 navigation list
#   at the top of the README, or in the YAML frontmatter `x-title`
#   field of each docs/* article. Same reason x-cmd/cve skips MD041.
#
# MD013 — long URLs (raw.githubusercontent.com fetch URLs, GnuPG
#   man-page links, x-cmd.com subdomain URLs) are common. Wrapping
#   them makes the curl pipelines harder to copy.
#
# MD033 — inline HTML is used by the BEGIN/END markers around the
#   keys table (regenerated by the team's release pipeline from
#   index.tsv). Required for the README's per-key table to render
#   in place of the placeholder.
#
# MD051 — anchors like `#how-to-verify-a-key` are referenced
#   without auto-slug conversion; rumdl flags them as missing.
#   Same pattern as x-cmd/cve.
#
# MD057 — false positives on cross-file links between docs/*.md
#   articles (e.g. `./2-how-the-keyring-is-published.md`). The
#   targets exist; rumdl doesn't walk the repo to resolve them.

[global]
disable = ["MD036", "MD041", "MD013", "MD033", "MD051", "MD057"]