id: x-gpg-8-sigstore-cosign-and-double-signing

<data>:
  - name:
      en: software-distribution-and-code-signing
    qa:
      - id: why-rpm-deb-still-gpg
        question:
          en: Sigstore exists now — why do RPM / DEB still rely on GPG?
        answer:
          en: |
            Two reasons. Historical compatibility: RPM, dnf,
            apt, pacman were all designed with deep OpenPGP
            integration from day one and remain 100%
            dependent on GPG keys for package signing.
            Philosophical: Sigstore requires an institutional
            anchor (typically a GitHub org) while GPG works
            for any signer including anonymous OSS
            contributors — and the OS-level package
            ecosystem has many signers without such anchors.
            As of 2026 the OS-level package managers don't
            natively verify Cosign signatures.
        confidence: 9
        reference:
          - docs/8-sigstore-cosign-and-double-signing.en.md

      - id: what-is-gpg-vs-key
        question:
          en: GPG software vs. GPG Key — what's the technical relationship?
        answer:
          en: |
            Same as Cosign's relationship to Sigstore. Cosign
            is the user-facing CLI program that performs the
            cryptographic operations; Sigstore (Fulcio +
            Rekor) is the data credential / service
            infrastructure it operates on. A team signing
            with Cosign doesn't hold a long-term keypair the
            way a team signing with GPG does — each signing
            event generates a fresh ephemeral keypair bound
            to a short-lived Fulcio certificate. The two
            paradigms differ in whether the "key credential"
            lives with the signer (GPG) or with the
            institutional identity provider (Sigstore).
        confidence: 9
        reference:
          - docs/8-sigstore-cosign-and-double-signing.en.md