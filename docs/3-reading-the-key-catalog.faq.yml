id: x-gpg-3-reading-the-key-catalog

<data>:
  - name:
      en: software-distribution-and-code-signing
    qa:
      - id: what-is-gpg-vs-key
        question:
          en: GPG software vs. GPG Key — what's the technical relationship?
        answer:
          en: |
            GPG is the program that performs cryptographic operations;
            the keypair is the data credential that holds the
            cryptographic material. A catalog like index.tsv documents
            only the public half of each keypair — the half that's
            safe to publish. The matching private keys are held by
            the publisher.
        confidence: 9
        reference:
          - docs/3-reading-the-key-catalog.en.md

      - id: why-not-unsigned
        question:
          en: Why don't publishers usually distribute unsigned raw packages?
        answer:
          en: |
            A catalog that lists keys for signed packages only makes
            sense because signing is the de-facto baseline — unsigned
            distribution is rarely published because package managers
            refuse to install unsigned packages by default, and the
            MITM / poisoning surface is unacceptable. Catalog entries
            represent signed artifacts; their existence implies
            signing, not its absence.
        confidence: 9
        reference:
          - docs/3-reading-the-key-catalog.en.md