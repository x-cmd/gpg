id: x-gpg-4-gpg-uid-naming-conventions

<data>:
  - name:
      en: software-distribution-and-code-signing
    qa:
      - id: what-is-gpg-vs-key
        question:
          en: GPG software vs. GPG Key — what's the technical relationship?
        answer:
          en: |
            The UID (User ID) is the human-readable label attached
            to a GPG keypair — it lives in the public-key packet
            alongside the cryptographic material but is *not*
            part of the material itself. Whether you write the
            UID as "Acme (Official Key)", "Acme®", or
            "Acme™" makes zero difference to the signature
            math: same fingerprint, same key bits, same
            signature validity. The choice is purely about
            display and (sometimes) legal clarity.
        confidence: 9
        reference:
          - docs/4-gpg-uid-naming-conventions.en.md