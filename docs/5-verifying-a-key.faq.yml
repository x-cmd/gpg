id: x-gpg-5-verifying-a-key

<data>:
  - name:
      en: software-distribution-and-code-signing
    qa:
      - id: what-is-gpg-vs-key
        question:
          en: GPG software vs. GPG Key — what's the technical relationship?
        answer:
          en: |
            GPG is the program that performs cryptographic operations;
            the keypair is the data credential that holds the
            cryptographic material. Verification uses only the public
            half of the keypair — the matching private key never needs
            to leave the publisher's infrastructure.
        confidence: 9
        reference:
          - docs/5-verifying-a-key.en.md

      - id: annual-key-cross-year
        question:
          en: If "1-year rotation" is adopted, how does industry solve cross-year transition and historical rollback?
        answer:
          en: |
            Standard pattern is Trust Anchor Registry, with the user's
            own keyring as the lever: keep a permanent public-key
            repository combining every historical annual public key
            into a single keyring, and require verifiers to import
            the historical keys alongside the current. That way, an
            artifact signed by last year's key keeps verifying on
            hosts that only have this year's key imported — because
            they imported the historical keys at the same time.
        confidence: 9
        reference:
          - docs/5-verifying-a-key.en.md