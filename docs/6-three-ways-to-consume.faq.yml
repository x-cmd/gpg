id: x-gpg-6-three-ways-to-consume

<data>:
  - name:
      en: software-distribution-and-code-signing
    qa:
      - id: why-rpm-deb-still-gpg
        question:
          en: Sigstore exists now — why do RPM / DEB still rely on GPG?
        answer:
          en: |
            rpm --import and apt-key add are GPG-native commands — the
            OS-level package managers don't have a Sigstore
            verification mode. So even though Sigstore has technical
            advantages, the de-facto distribution channel for OS
            packages remains GPG. Consumers in this ecosystem must
            have a GPG-signed keyring to bootstrap.
        confidence: 9
        reference:
          - docs/6-three-ways-to-consume.en.md

      - id: annual-key-cross-year
        question:
          en: If "1-year rotation" is adopted, how does industry solve cross-year transition and historical rollback?
        answer:
          en: |
            Standard pattern is Trust Anchor Registry, with the user's
            own keyring as the lever: bundle every historical annual
            public key into a single keyring that consumers import
            once and keep installed. This makes the choice of "which
            transport to fetch the keyring from" orthogonal to "which
            keys are in the keyring" — all historical keys travel
            together, regardless of how they're shipped.
        confidence: 9
        reference:
          - docs/6-three-ways-to-consume.en.md