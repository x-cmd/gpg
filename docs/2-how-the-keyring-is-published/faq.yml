id: x-gpg-2-publishing-your-own-gpg-keyring

<data>:
  - name:
      en: software-distribution-and-code-signing
    qa:
      - id: what-is-gpg-vs-key
        question:
          en: GPG software vs. GPG Key — what's the technical relationship?
        answer:
          en: |
            For a publisher, this distinction matters in a
            practical way: gpg (the executable) is what you
            invoke to generate keys, sign artifacts, and
            export the public half. The keypair (the data
            credential) is what you operate on — the private
            half stays with whoever signs; the public half is
            what you publish under keyring/<handle>.asc so
            consumers can verify.
        confidence: 9
        reference:
          - docs/2-how-the-keyring-is-published.en.md

      - id: why-rpm-deb-still-gpg
        question:
          en: Sigstore exists now — why do RPM / DEB still rely on GPG?
        answer:
          en: |
            The OS-level package managers (`dnf`, `apt`) all
            natively verify GPG signatures. Until Sigstore
            gains OS-package-manager support, signing RPMs /
            DEBs for distribution through those channels
            requires GPG. The pipeline: build unsigned RPM →
            rpmsign --addsign with the team key → publish
            to the yum/apt repo; consumers' package managers
            verify automatically on install.
        confidence: 9
        reference:
          - docs/2-how-the-keyring-is-published.en.md

      - id: never-expire-pro-con
        question:
          en: What are the pros and cons of hardcoding a GPG key to "never expire"?
        answer:
          en: |
            For a publisher, this matters because expiry
            becomes an operational event: every host with
            your artifact installed fails gpg --verify the
            moment the key expires. Long-term keys avoid that
            "key expired" outage on unattended production
            hosts, but they expose a wider blast radius if
            the private key leaks. The "no expiry
            cryptographically, annual rotation operationally"
            pattern (annual isolation key + community master
            key) is one defensible design.
        confidence: 9
        reference:
          - docs/3-annual-key-strategy-explained.en.md